.layout{grid-template-columns:230px minmax(0,1fr);gap:0;min-height:0}
.side,.main{background:#fff;border:0;border-radius:0;overflow:auto}
.side{border-right:1px solid #edf0f2;padding:14px 10px;gap:4px}
.nav{color:#6c747b;border-radius:12px;padding:13px 15px}

.sidefoot{border-top:1px solid #edf0f2}
.main{padding:24px 26px;min-height:0}

.card{background:#fff;border:1px solid #e7eaed;border-radius:16px;box-shadow:0 2px 8px #182b3b08}

function t(source){const lang=currentLanguage();return (LUNEX_I18N[lang]&&LUNEX_I18N[lang][source])||LUNEX_I18N.ru[source]||source}

/* LUNEX i18n: один источник текста + обратный поиск.
   Благодаря этому язык можно менять сколько угодно раз и с любой страницы/окна,
   включая динамически созданные промежуточные экраны. */
function lunexCanonical(value){
 const s=String(value??'').trim();
 if(!s)return s;
 // Если узел уже получил исходный ключ — используем его.
 // Это делает переключение языка полностью обратимым.
 const all=LUNEX_I18N;
 for(const base of Object.keys(all.ru||{})){
   if(s===base)return base;
   for(const lang of Object.keys(all)){
     if(all[lang]?.[base]===s)return base;
   }
 }
 return s;
}
function lunexTranslateValue(value){
 const key=lunexCanonical(value);
 const lang=currentLanguage();
 return (LUNEX_I18N[lang]?.[key]) ?? (LUNEX_I18N.ru?.[key]) ?? value;
}
function applyTranslations(root=document){
 const lang=currentLanguage();
 document.documentElement.lang=lang;
 if(!root)return;

 const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walk.nextNode())nodes.push(walk.currentNode);

 for(const n of nodes){
   if(!n.parentElement)continue;
   // Не трогаем содержимое script/style и пользовательский текст сообщений/имён.
   const tag=n.parentElement.tagName;
   if(tag==='SCRIPT'||tag==='STYLE'||tag==='NOSCRIPT')continue;
   const raw=n.nodeValue||'';
   const trimmed=raw.trim();
   if(!trimmed)continue;
   const key=n.__lunexKey || lunexCanonical(trimmed);
   const translated=lunexTranslateValue(key);
   if(translated!==trimmed){
     n.__lunexKey=key;
     n.nodeValue=raw.replace(trimmed,translated);
   }else if((LUNEX_I18N[lang]?.[key] || LUNEX_I18N.ru?.[key])){
     n.__lunexKey=key;
     n.nodeValue=raw.replace(trimmed,translated);
   }
 }

 root.querySelectorAll?.('input[placeholder],textarea[placeholder],[aria-label],option').forEach(el=>{
   if(el.tagName==='OPTION' && LUNEX_LANGUAGES.some(x=>x.v===el.value)) return;

   if(el.hasAttribute('placeholder')){
     const raw=el.getAttribute('placeholder')||'';
     const key=el.dataset.lunexPlaceholderKey || lunexCanonical(raw);
     el.dataset.lunexPlaceholderKey=key;
     el.setAttribute('placeholder',lunexTranslateValue(key));
   }

   if(el.hasAttribute('aria-label')){
     const raw=el.getAttribute('aria-label')||'';
     const key=el.dataset.lunexAriaKey || lunexCanonical(raw);
     el.dataset.lunexAriaKey=key;
     el.setAttribute('aria-label',lunexTranslateValue(key));
   }
 });
}
function setAppLanguage(lang,persist=true){
 if(!LUNEX_LANGUAGES.some(x=>x.v===lang))lang='ru';
 if(persist)localStorage.setItem('lunexLanguage',lang);
 if(userData)userData.language=lang;
 refreshLunexLanguage();
}
function refreshLunexLanguage(){
  try{

}

function formatFileSize(bytes){
  const n=Number(bytes||0);

}

function showLogoutDialog(){ const modal=$('logoutModal'); modal.classList.remove('hidden','closing'); modal.setAttribute('aria-hidden','false'); $('cancelLogout').focus(); }

function friendly(e){const c=e?.code||'';return ({'auth/email-already-in-use':'Эта почта уже зарегистрирована.','auth/invalid-email':'Проверь адрес электронной почты.','auth/weak-password':'Пароль должен содержать минимум 6 символов.','auth/invalid-credential':'Неверная почта или пароль.','auth/network-request-failed':'Проблема с интернет-соединением.','permission-denied':'Firebase отклонил операцию: проверь правила Firestore.'})[c]||e?.message||'Произошла ошибка.'}
async function newLunexId(){for(let i=0;i<12;i++){const id=String(Math.floor(10000000+Math.random()*90000000));const q=await getDocs(query(collection(db,'users'),where('lunexId','==',id)));if(q.empty)return id}throw Error('Не удалось выдать ID. Попробуй ещё раз.')}

}

const ADMIN_UID='M4sN97VqP7XNFMmVPP4Ap14TF4y1';
function isAdmin(){return !!currentUser && currentUser.uid===ADMIN_UID;}
function openAdminDirect(){if(!currentUser){alert('Сначала войди в LUNEX.');return;}if(!isAdmin()){alert('Этот аккаунт не распознан как администратор. UID: '+currentUser.uid);return;}showPage('admin');}
function ensureAdminAccess(){
  const admin=!!currentUser && currentUser.uid===ADMIN_UID;
  const entry=$('adminEntry');
  if(entry) entry.style.display=admin?'block':'none';
  const menuEntry=$('adminMenuEntry');
  if(menuEntry){
    menuEntry.style.setProperty('display',admin?'block':'none','important');
    menuEntry.disabled=!admin;
    menuEntry.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      if(!admin){alert('Доступ запрещён.');return;}
      const menu=$('headerMenu');
      if(menu) menu.classList.add('hidden');
      const mb=$('headerMenuButton');
      if(mb) mb.setAttribute('aria-expanded','false');
      currentPage='admin';
      showPage('admin');
    };
  }
}

  if(/heart|love|kissed|peach|charm|amulet|locket/.test(k)) shape=`<g>${shadow}<path d="M64 122C54 109 23 91 23 66c0-16 13-28 29-28 8 0 16 4 21 12 5-8 13-12 21-12 16 0 29 12 29 28 0 25-31 43-59 56z" fill="url(#g)"/><path d="M43 53c6-7 16-9 24-3" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/></g>`;

/* Repriced NFTs: scarcer gifts receive larger price increases. Pepe stays fixed at 550,000 ⭐. */
(function lunexRaiseNftPrices(){
  if(!Array.isArray(giftItems)) return;
  giftItems.forEach(g=>{
    if(!g?.nft || g.id==='pepe') return;
    const base=Number(g.cost||0), supply=Number(g.supply||0);
    let mult=1.25;
    if(supply<=75) mult=3.00;
    else if(supply<=150) mult=2.50;
    else if(supply<=250) mult=2.00;

async function cropAvatarToSquare(file,size=512){
 return await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const side=Math.min(img.naturalWidth,img.naturalHeight);const sx=(img.naturalWidth-side)/2,sy=(img.naturalHeight-side)/2;const canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,sx,sy,side,side,0,0,size,size);canvas.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(Error('Не удалось подготовить аватарку.'));},'image/jpeg',.9);}catch(e){URL.revokeObjectURL(url);reject(e);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Не удалось прочитать изображение.'));};img.src=url;});
}

async function claimAdvent(){const button=$('claimDay');button.disabled=true;try{await runTransaction(db,async tx=>{const ref=doc(db,'users',currentUser.uid),snap=await tx.get(ref);if(!snap.exists())throw Error('Профиль не найден.');const data=snap.data(),adv=data.advent||{},oldClaimed=Array.isArray(adv.claimedDays)?adv.claimedDays:[],last=Number(adv.lastClaimAt||0),now=Date.now();if(last&&now-last<CLAIM_INTERVAL){const remain=CLAIM_INTERVAL-(now-last),h=Math.floor(remain/3600000),m=Math.ceil((remain%3600000)/60000);throw Error(`Следующая награда будет доступна примерно через ${h} ч ${m} мин.`)}const cycleFinished=oldClaimed.length>=ADVENT_DAYS;const claimed=cycleFinished?[]:oldClaimed;const n=claimed.length+1;const sameDay=last&&new Date(now).toDateString()===new Date(last).toDateString();const streak=sameDay?Number(adv.streak||0):Number(adv.streak||0)+1;tx.update(ref,{stars:Number(data.stars||0)+DAILY_REWARD,advent:{claimedDays:[...claimed,n],lastClaimAt:now,streak}})});const s=await getDoc(doc(db,'users',currentUser.uid));userData=s.data();renderBalance();showPage('profile');setStatus('adventStatus',`Награда +${DAILY_REWARD} звезды получена!`)}catch(e){setStatus('adventStatus',friendly(e))}finally{button.disabled=false}}
function askRecipientLunexId(giftName){
 return new Promise(resolve=>{
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:999999;background:rgba(2,6,23,.8);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box';
  const safeName=String(giftName).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  overlay.innerHTML=`<form style="box-sizing:border-box;width:min(100%,420px);background:#111a31;border:1px solid #35456d;border-radius:22px;padding:24px;color:#f4f7ff;box-shadow:0 24px 80px #0009;font-family:inherit">
   <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><span style="font-size:28px">🎁</span><h2 style="font-size:22px;margin:0">Подарить ${safeName}</h2></div>
   <p style="margin:0 0 16px;color:#9fb2d7;font-size:14px">Введи LUNEX ID получателя (8 цифр):</p>
   <input id="recipientIdInput" type="text" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Например, 12345678" required style="box-sizing:border-box;width:100%;height:50px;border-radius:12px;border:1px solid #3c4d79;background:#081126;color:white;padding:0 14px;font:inherit;font-size:18px;letter-spacing:2px;outline:none">
   <div id="recipientIdError" style="color:#ff929f;min-height:20px;font-size:13px;margin-top:8px"></div>
   <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
    <button type="button" id="recipientCancel" class="secondary" style="padding:12px 18px;border-radius:12px">Отмена</button>
    <button type="submit" class="primary" style="padding:12px 22px;border-radius:12px">Продолжить</button>
   </div></form>`;
  document.body.appendChild(overlay);
  const form=overlay.querySelector('form'),input=overlay.querySelector('#recipientIdInput'),err=overlay.querySelector('#recipientIdError');
  let finished=false;
  const finish=value=>{if(finished)return;finished=true;document.removeEventListener('keydown',onKey);overlay.remove();resolve(value)};
  const onKey=e=>{if(e.key==='Escape')finish(null)};
  input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,8);err.textContent=''});
  overlay.querySelector('#recipientCancel').addEventListener('click',()=>finish(null));
  overlay.addEventListener('click',e=>{if(e.target===overlay)finish(null)});
  form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!/^\d{8}$/.test(value)){err.textContent='ID должен состоять ровно из 8 цифр.';return}finish(value)});
  document.addEventListener('keydown',onKey);
  setTimeout(()=>input.focus(),50);
 });
}

/* LUNEX NFT VARIANTS
   Every NFT purchase receives a random visual variant. The variant is stored in the NFT inventory,
   so the same NFT keeps its appearance after reload. The visual treatment is generated from the
   existing Lunex/Telegram-style artwork; exact Telegram model catalogs require Telegram API access.
*/
const LUNEX_NFT_VARIANTS=[
  {name:'Classic',filter:'none',transform:'translateY(0) rotate(0deg) scale(1)',bg:'linear-gradient(145deg,#18253d,#101827)'},
  {name:'Ruby',filter:'hue-rotate(-25deg) saturate(1.45) contrast(1.08)',transform:'translate(-2px,2px) rotate(-4deg) scale(1.04)',bg:'linear-gradient(145deg,#5b1829,#17121d)'},
  {name:'Azure',filter:'hue-rotate(150deg) saturate(1.28) brightness(1.04)',transform:'translate(2px,-2px) rotate(4deg) scale(.98)',bg:'linear-gradient(145deg,#123f63,#111a2b)'},
  {name:'Violet',filter:'hue-rotate(65deg) saturate(1.38) contrast(1.06)',transform:'translateY(-3px) rotate(7deg) scale(1.06)',bg:'linear-gradient(145deg,#3a1d5e,#141525)'},
  {name:'Emerald',filter:'hue-rotate(95deg) saturate(1.3)',transform:'translateY(2px) rotate(-7deg) scale(.96)',bg:'linear-gradient(145deg,#124b3b,#101d1b)'},
  {name:'Golden',filter:'sepia(.34) saturate(1.65) hue-rotate(-8deg) brightness(1.08)',transform:'translateX(2px) rotate(2deg) scale(1.08)',bg:'linear-gradient(145deg,#5a4317,#191711)'},
  {name:'Rose',filter:'hue-rotate(-55deg) saturate(1.4)',transform:'translate(-1px,-2px) rotate(-2deg) scale(1.02)',bg:'linear-gradient(145deg,#5a2444,#19131f)'},
  {name:'Cosmic',filter:'saturate(1.5) contrast(1.16) brightness(1.06)',transform:'translateY(-1px) rotate(5deg) scale(1.05)',bg:'linear-gradient(145deg,#291655,#10162e)'}
];
function nftVariant(item){
  const idx=Math.max(0,Math.min(LUNEX_NFT_VARIANTS.length-1,Number(item?.variantIndex||0)));
  return LUNEX_NFT_VARIANTS[idx];
}
function nftVariantSet(g){
  if(!g?.nft) return [];
  const count=Math.min(8,Math.max(4,8));
  return LUNEX_NFT_VARIANTS.slice(0,count).map((v,i)=>({...v,index:i}));
}
function nftVisual(g,item,extra=''){
  if(!g?.nft) return `<img src="${esc(giftPicture(g.art))}" alt="${esc(g.name)}" ${extra}>`;
  const v=nftVariant(item);
  return `<span class="lunex-nft-visual lunex-themed-backdrop" data-gift-art="${esc(g.art)}" style="background:${v.bg}"><img src="${esc(giftPicture(g.art))}" alt="${esc(g.name)} — ${esc(v.name)}" style="filter:${v.filter};transform:${v.transform}" ${extra}></span>`;
}
function randomNftVariant(g){return Math.floor(Math.random()*nftVariantSet(g).length)}

async function sendGift(giftId, presetLunexId = null) {
  const g = giftItems.find(x => x.id === giftId);
  if (!g) return;

  const to = presetLunexId || await askRecipientLunexId(g.name);
  if (to === null) return;

  try {
    const found = await getDocs(
      query(collection(db, 'users'), where('lunexId', '==', to))
    );

    if (found.empty) {
      setStatus('giftStatus', 'Получатель не найден. Проверь LUNEX ID.');
      return;
    }

    const recipientDoc = found.docs[0];
    const recipientId = recipientDoc.id;
    const senderRef = doc(db, 'users', currentUser.uid);
    const recipientRef = doc(db, 'users', recipientId);
    const isSelfGift = currentUser.uid === recipientId;
    const convId = [currentUser.uid, recipientId].sort().join('_');
    const convRef = doc(db, 'conversations', convId);
    const giftMessageRef = isSelfGift ? null : doc(collection(db, 'conversations', convId, 'messages'));

    await runTransaction(db, async (tx) => {
      const senderSnap = await tx.get(senderRef);
      if (!senderSnap.exists()) throw new Error('Профиль отправителя не найден.');

      const senderData = senderSnap.data();
      let recipientData;

      if (isSelfGift) {
        recipientData = senderData;
      } else {
        const recipientSnap = await tx.get(recipientRef);
        if (!recipientSnap.exists()) throw new Error('Профиль получателя не найден.');
        recipientData = recipientSnap.data();
      }

      const price = Number(g.cost || 0);
      const currentStars = Number(senderData.stars || 0);
      if (currentStars < price) {
        throw new Error(`Недостаточно звёзд. Нужно ${price.toLocaleString('ru-RU')} ⭐.`);
      }

      const inventory = Array.isArray(recipientData.giftInventory)
        ? [...recipientData.giftInventory] : [];
      const nftInventory = Array.isArray(recipientData.nftInventory)
        ? [...recipientData.nftInventory] : [];

      let serial = null;
      if (g.nft) {
        const supplyRef = doc(db, 'nftSupply', String(g.id));
        const supplySnap = await tx.get(supplyRef);
        const initialRemaining = Math.max(0, Number(g.supply || 0));
        const remaining = supplySnap.exists()
          ? Number(supplySnap.data().remaining ?? initialRemaining)
          : initialRemaining;
        if (remaining <= 0) throw new Error('Этот тираж LIMITED уже закончился.');
        tx.set(supplyRef, { giftId: String(g.id), total: initialRemaining, remaining: remaining - 1 }, { merge: true });
        const used = Math.max(0, initialRemaining - remaining);
        const editionNumber = Number(supplySnap.data()?.nextSerial ?? (used + 1));
        serial = `${editionNumber}/${initialRemaining}`;
        tx.set(supplyRef, {
          giftId: String(g.id),
          total: initialRemaining,
          remaining: remaining - 1,
          nextSerial: editionNumber + 1
        }, { merge: true });
        nftInventory.push({
          giftId: String(g.id),
          serial: String(serial),
          variantIndex: randomNftVariant(g),
          receivedAt: Date.now()
        });
      } else {
        const existing = inventory.find(item => item.giftId === g.id && !item.serial);
        if (existing) {
          existing.quantity = Number(existing.quantity || 1) + 1;
        } else {
          inventory.push({ giftId: g.id, quantity: 1, receivedAt: Date.now() });
        }
      }

      if (isSelfGift) {
        tx.set(senderRef, {
          stars: currentStars - price,
          giftInventory: inventory,
          nftInventory: nftInventory
        }, { merge: true });
      } else {
        tx.set(senderRef, { stars: currentStars - price }, { merge: true });
        tx.set(recipientRef, {
          giftInventory: inventory,
          nftInventory: nftInventory
        }, { merge: true });
      }

      const eventRef = doc(collection(db, 'giftEvents'));
      tx.set(eventRef, {
        from: currentUser.uid,
        to: recipientId,
        giftId: g.id,
        giftName: g.name,
        cost: price,
        nft: !!g.nft,
        serial,
        variantIndex: g.nft ? Number(nftInventory[nftInventory.length-1]?.variantIndex||0) : null,
        selfGift: isSelfGift,
        createdAt: serverTimestamp()
      });
      if(!isSelfGift && giftMessageRef){
        tx.set(convRef,{
          members:[currentUser.uid,recipientId].sort(),
          lastMessage:`🎁 ${g.name.replace(' · LIMITED','')} · ${price.toLocaleString('ru-RU')} ⭐`,
          updatedAt:serverTimestamp()
        },{merge:true});
        tx.set(giftMessageRef,{
          messageType:'gift',
          giftId:g.id,
          giftName:g.name,
          giftCost:price,
          nft:!!g.nft,
          serial,
          variantIndex: g.nft ? Number(nftInventory[nftInventory.length-1]?.variantIndex||0) : null,
          senderId:currentUser.uid,
          senderName:senderData.name||currentUser.displayName||'Пользователь',
          recipientId,
          createdAt:serverTimestamp(),
          readBy:[currentUser.uid],
          unreadFor:[recipientId]
        });
      }
    });

    const updatedSender = await getDoc(senderRef);
    if (updatedSender.exists()) {
      userData = updatedSender.data();
      renderBalance();
    }

    const recipientName = recipientDoc.data().name || 'получателю';
    setStatus('giftStatus', isSelfGift
      ? `🎁 «${g.name}» добавлен в твой инвентарь. Списано ${g.cost.toLocaleString('ru-RU')} ⭐.`
      : `🎁 Подарок «${g.name}» отправлен ${recipientName}!`);

  } catch (e) {
    console.error('Ошибка отправки подарка:', e);
    setStatus('giftStatus', friendly(e));
  }
}

async function sellRegularGift(index){const item=myGiftItems()[index];if(!item)return;const g=giftItems.find(x=>x.id===item.giftId&&!x.nft);if(!g)return;const qty=Number(item.quantity||1);const receive=Math.round(g.cost*.85*10)/10; if(!confirm(`Продать «${g.name}» за ${receive} ⭐? Комиссия 15%.`))return;try{await runTransaction(db,async tx=>{const ref=doc(db,'users',currentUser.uid),snap=await tx.get(ref);if(!snap.exists())throw Error('Профиль не найден.');const d=snap.data(),arr=Array.isArray(d.giftInventory)?[...d.giftInventory]:[];const current=arr[index];if(!current||current.giftId!==item.giftId||Number(current.quantity||1)<1)throw Error('Подарок уже отсутствует в инвентаре.');if(Number(current.quantity||1)>1)arr[index]={...current,quantity:Number(current.quantity)-1};else arr.splice(index,1);tx.set(ref,{giftInventory:arr,stars:Number(d.stars||0)+receive},{merge:true});});const snap=await getDoc(doc(db,'users',currentUser.uid));userData=snap.data();renderBalance();showMyGifts();setStatus('inventoryStatus',`Продано за ${receive} ⭐ (комиссия 15%).`)}catch(e){setStatus('inventoryStatus','Не удалось продать: '+friendly(e))}}
async function listNft(index) {
  const item = myNftItems()[index];
  if (!item) return;
  const gift = giftItems.find(x => x.id === item.giftId && x.nft);
  if (!gift) return;
  const raw = prompt(`За сколько ⭐ выставить «${gift.name.replace(' · LIMITED', '')}»?`);
  if (raw === null) return;
  const price = Number(raw);
  if (!Number.isFinite(price) || price <= 0 || !Number.isInteger(price)) {
    setStatus('inventoryStatus', 'Укажи положительную целую цену в звёздах.');
    return;
  }
  try {
    const userRef = doc(db, 'users', currentUser.uid);
    const listingRef = doc(collection(db, 'nftListings'));
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(userRef);
      if (!snap.exists()) throw Error('Профиль не найден.');
      const data = snap.data();
      const inventory = Array.isArray(data.nftInventory) ? [...data.nftInventory] : [];
      const pos = inventory.findIndex(x => x.giftId === item.giftId && String(x.serial || '') === String(item.serial || ''));
      if (pos < 0) throw Error('Этот LIMITED не найден в инвентаре.');
      const [owned] = inventory.splice(pos, 1);
      tx.set(userRef, { nftInventory: inventory }, { merge: true });
      tx.set(listingRef, {
        sellerId: currentUser.uid,
        giftId: gift.id,
        serial: owned.serial || null,
        variantIndex: Number(owned.variantIndex || 0),
        price: price,
        status: 'active',
        createdAt: serverTimestamp()
      });
    });
    const updated = await getDoc(userRef);
    userData = updated.data();
    showMyGifts();
    setStatus('inventoryStatus', 'Лимитированный подарок выставлен на продажу.');
  } catch (e) {
    setStatus('inventoryStatus', 'Не удалось выставить LIMITED: ' + friendly(e));
  }
}

async function buyListedNft(listingId,sellerId){if(sellerId===currentUser.uid){setStatus('nftMarketStatus','Нельзя купить собственный LIMITED.');return}const listingRef=doc(db,'nftListings',listingId),buyerRef=doc(db,'users',currentUser.uid),sellerRef=doc(db,'users',sellerId);try{await runTransaction(db,async tx=>{const [ls,bs,ss]=await Promise.all([tx.get(listingRef),tx.get(buyerRef),tx.get(sellerRef)]);if(!ls.exists()||!bs.exists()||!ss.exists())throw Error('Предложение или профиль не найден.');const l=ls.data(),buyer=bs.data(),seller=ss.data();if(l.status!=='active')throw Error('Это предложение уже недоступно.');if(Number(buyer.stars||0)<Number(l.price))throw Error('Недостаточно звёзд.');const nft={giftId:l.giftId,serial:l.serial||null,variantIndex:Number(l.variantIndex||0),receivedAt:Date.now()};tx.set(buyerRef,{stars:Number(buyer.stars||0)-Number(l.price),nftInventory:[...(Array.isArray(buyer.nftInventory)?buyer.nftInventory:[]),nft]},{merge:true});tx.set(sellerRef,{stars:Number(seller.stars||0)+Number(l.price)},{merge:true});tx.set(listingRef,{status:'sold',buyerId:currentUser.uid,soldAt:serverTimestamp()},{merge:true});});const snap=await getDoc(buyerRef);userData=snap.data();renderBalance();await showNftMarket();setStatus('nftMarketStatus','LIMITED куплен и добавлен в «Мои лимитированные».')}catch(e){setStatus('nftMarketStatus','Покупка не выполнена: '+friendly(e))}}

async function refreshLimitedStocks(){
  document.querySelectorAll('[data-limited-id]').forEach(async card=>{
    const id=card.dataset.limitedId;
    const g=giftItems.find(x=>x.id===id&&x.nft);
    const out=card.querySelector('.limited-remaining');
    if(!g||!out)return;
    try{
      const snap=await getDoc(doc(db,'nftSupply',String(id)));
      const remaining=snap.exists()?Number(snap.data().remaining??g.supply):Number(g.supply);
      out.textContent=remaining>0?`· ${remaining} / ${Number(g.supply||0)}`:'· 0 / '+Number(g.supply||0);
      const btn=card.querySelector('[data-gift]');
      if(btn&&remaining<=0){btn.disabled=true;btn.textContent='Тираж закончился';}
    }catch(_){out.textContent='';}
  });
}

async function lunexAwardGiftInTransaction(tx,userRef,g){

async function lunexShowCaseOpening(c){

function lunexUpgradeAudio(type='tick'){
  try{

    const cfg=type==='win'?{f:760,d:.22,v:.075}:{f:210,d:.055,v:.045};
    o.type=type==='win'?'sine':'triangle';o.frequency.setValueAtTime(cfg.f,now);
    if(type==='win')o.frequency.exponentialRampToValueAtTime(1180,now+cfg.d);
    g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(cfg.v,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+cfg.d);
    o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+cfg.d+.02);
  }catch(_e){}
}

async function lunexWithdrawGameGift(index){
 const entries=lunexGameInvEntries(),entry=entries[index];if(!entry)return;const x=entry.x,g=entry.g;if(Number(x.withdrawAvailableAt||0)>Date.now()){lunexGameToast('Вывод станет доступен через 20 минут после поступления.','lunex-lose');return;}
 try{await runTransaction(db,async tx=>{const ref=doc(db,'users',currentUser.uid),snap=await tx.get(ref);if(!snap.exists())throw Error('Профиль не найден.');const d=snap.data(),arr=Array.isArray(d.gameCenterInventory)?[...d.gameCenterInventory]:[];const pos=arr.findIndex(v=>v===x || (v.giftId===x.giftId&&String(v.serial||'')===String(x.serial||'')&&Number(v.receivedAt||0)===Number(x.receivedAt||0)));if(pos<0)throw Error('Предмет уже выведен.');const item=arr[pos];arr.splice(pos,1);const inv=Array.isArray(d.giftInventory)?[...d.giftInventory]:[];if(g.nft){const nfts=Array.isArray(d.nftInventory)?[...d.nftInventory]:[];nfts.push({giftId:g.id,serial:item.serial||null,variantIndex:Number(item.variantIndex||0),receivedAt:Date.now(),withdrawnFromGameCenter:true});tx.set(ref,{gameCenterInventory:arr,nftInventory:nfts},{merge:true});}else{const ex=inv.find(v=>v.giftId===g.id&&!v.serial);if(ex)ex.quantity=Number(ex.quantity||1)+1;else inv.push({giftId:g.id,quantity:1,receivedAt:Date.now()});tx.set(ref,{gameCenterInventory:arr,giftInventory:inv},{merge:true});}});userData=(await getDoc(doc(db,'users',currentUser.uid))).data();showGameCenter();}catch(e){lunexGameToast(esc(friendly(e)),'lunex-lose');}
}
async function lunexLoadLeaders(){
  const box=$('lunexLeaderList');if(!box)return;box.innerHTML='<div class="lunex-game-empty">Загружаем таблицу…</div>';
  try{
    const snap=await getDocs(query(collection(db,'users'),orderBy('gameStats.totalDrops','desc'),limit(20)));
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.gameStats).slice(0,20);
    if(!rows.length){box.innerHTML='<div class="lunex-game-empty">Пока никто не играл. Стань первым.</div>';return;}

  }catch(e){
    const gs=userData?.gameStats||{};box.innerHTML=`<div class="lunex-leader-row"><div class="lunex-leader-rank top1">1</div><div class="lunex-leader-main"><strong>${esc(userData?.name||currentUser?.displayName||'Ты')}</strong><span>${Number(gs.upgradeWins||0)} апгрейдов · ${Number(gs.casesOpened||0)} кейсов</span></div><div class="lunex-leader-score">⭐ ${lunexGameNum(gs.totalDrops||0)}<small>всего выбито</small></div></div><div class="lunex-game-empty" style="margin-top:8px">Общий рейтинг пока недоступен: ${esc(friendly(e))}</div>`;
  }

function lunexShowCaseDetails(caseId){
  const c=LUNEX_GAME_CASES.find(x=>x.id===caseId);if(!c)return;
  document.getElementById('lunexCaseDetails')?.remove();
  const items=c.items.map(([id,ch])=>({g:lunexGameGift(id),ch})).filter(x=>x.g);
  const rows=items.map(x=>`<div class="lunex-detail-drop"><img src="${esc(giftPicture(x.g.art))}"><div><b>${esc(x.g.name.replace(' · LIMITED',''))}</b><small>⭐ ${lunexGameNum(x.g.cost)}</small></div><strong>${x.ch}%</strong></div>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="lunex-case-modal" id="lunexCaseDetails"><div class="lunex-case-modal-card"><button class="lunex-modal-x" id="lunexCaseClose">×</button><img class="lunex-modal-case-art" src="${lunexCaseVisual(c)}"><span class="lunex-case-rarity">${esc(c.rarity)}</span><h2>${esc(c.name)}</h2><p>${esc(c.subtitle)}</p><div class="lunex-modal-price">⭐ ${lunexGameNum(c.cost)} <small>за открытие</small></div><div class="lunex-drop-title">СОДЕРЖИМОЕ И ШАНСЫ</div><div class="lunex-detail-drops">${rows}</div><button class="lunex-game-button lunex-modal-open" data-game-open-case="${c.id}" ${Number(stars())<c.cost?'disabled':''}>Открыть кейс</button></div></div>`);
  const m=document.getElementById('lunexCaseDetails');m.querySelector('#lunexCaseClose').onclick=()=>m.remove();m.addEventListener('click',e=>{if(e.target===m)m.remove();});m.querySelector('[data-game-open-case]').onclick=()=>{m.remove();lunexOpenCase(c.id);};
}
function wireGameCenter(){
  document.querySelectorAll('[data-game-tab]').forEach(b=>b.onclick=()=>{lunexGameTab=b.dataset.gameTab;lunexUpSource=null;lunexUpTarget=null;showGameCenter();});
  document.querySelectorAll('[data-game-open-case]').forEach(b=>b.onclick=()=>lunexOpenCase(b.dataset.gameOpenCase));
  document.querySelectorAll('[data-game-case-info]').forEach(card=>card.onclick=e=>{if(e.target.closest('[data-game-open-case]'))return;lunexShowCaseDetails(card.dataset.gameCaseInfo);});
  document.querySelectorAll('[data-game-source]').forEach(b=>b.onclick=()=>{const key=b.dataset.gameSource;lunexUpSource=lunexGameOwnedEntries().find(x=>x.key===key)||null;lunexUpTarget=null;showGameCenter();});
  document.querySelectorAll('[data-game-withdraw]').forEach(b=>b.onclick=()=>lunexWithdrawGameGift(Number(b.dataset.gameWithdraw)));
  document.querySelectorAll('[data-game-target]').forEach(b=>b.onclick=()=>{lunexUpTarget=lunexGameGift(b.dataset.gameTarget);showGameCenter();});
  const ub=$('lunexUpgradeButton');if(ub)ub.onclick=lunexUpgrade;
  const rb=$('lunexLeadersRefresh');if(rb)rb.onclick=lunexLoadLeaders;
  if(lunexGameTab==='leaders')lunexLoadLeaders();

function showGameCenter(){

const _showPageForGameCenter=showPage;
showPage=function(page){if(page==='gamecenter'){showGameCenter();return;}_showPageForGameCenter(page)};

<script>
/* LUNEX BETA 1 — avatar API. Profile saving is the single upload path. */
window.changeLunexAvatar=async function(file){
  if(!file||!window.currentUser)return;
  if(!file.type.startsWith('image/')){alert('Можно выбрать только изображение.');return;}
  try{
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const r=storageRef(window.storage,'avatars/'+window.currentUser.uid+'/'+Date.now()+'_'+safe);
    const task=uploadBytesResumable(r,file,{contentType:file.type});
    await new Promise((resolve,reject)=>task.on('state_changed',()=>{},reject,resolve));
    const url=await getDownloadURL(task.snapshot.ref);
    await setDoc(doc(window.db,'users',window.currentUser.uid),{avatar:url,photoURL:url,avatarUrl:url,updatedAt:serverTimestamp()},{merge:true});
    window.userData={...(window.userData||{}),avatar:url,photoURL:url,avatarUrl:url};
    if(typeof renderBalance==='function')renderBalance();
    if(typeof showPage==='function'&&typeof currentPage!=='undefined')showPage(currentPage);
  }catch(e){console.error(e);alert('Не удалось изменить аватарку. Проверь Firebase Storage.');}
};

/* LUNEX: Telegram-style collectible backdrops — a repeating themed symbol pattern behind each gift. */
.lunex-themed-backdrop{position:relative;overflow:hidden;isolation:isolate;}
.lunex-themed-backdrop > img,.lunex-themed-backdrop > .lunex-nft-visual,.lunex-themed-backdrop > .lunex-theme-pattern{position:relative;z-index:1}
.lunex-theme-pattern{position:absolute!important;inset:0;z-index:0!important;pointer-events:none;overflow:hidden;opacity:.92}
.lunex-theme-pattern i{position:absolute;display:block;font-family:system-ui,"Segoe UI Symbol",sans-serif;font-style:normal;font-weight:800;line-height:1;color:rgba(255,255,255,.20);text-shadow:0 1px 7px rgba(0,0,0,.18);transform-origin:center;user-select:none;}
.lunex-theme-pattern i:nth-child(3n){color:rgba(255,255,255,.14)}
.lunex-theme-pattern i:nth-child(4n){color:rgba(0,0,0,.10)}
.lunex-theme-pattern i:nth-child(5n){font-size:.78em}
.lunex-art-wrap .lunex-theme-pattern i{font-size:28px}
.lunex-art-wrap .lunex-theme-pattern i:nth-child(2n){font-size:21px}
.lunex-profile-gift-art .lunex-theme-pattern i{font-size:16px}
.lunex-nft-variant-art .lunex-theme-pattern i{font-size:22px}
.lunex-detail-theme{height:240px;border-radius:18px;background:radial-gradient(circle at 50% 42%,#1b2c4d,#0b1326 74%);display:grid;place-items:center}
.tg-gift-detail .lunex-detail-theme>img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box}
.lunex-themed-backdrop::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 -18px 35px rgba(0,0,0,.08)}
body:not(.dark-theme) .lunex-theme-pattern i{color:rgba(36,63,93,.18);text-shadow:none}
body:not(.dark-theme) .lunex-theme-pattern i:nth-child(3n){color:rgba(50,88,120,.13)}
body:not(.dark-theme) .lunex-theme-pattern i:nth-child(4n){color:rgba(255,255,255,.56)}
@media(max-width:480px){.lunex-detail-theme{height:210px}.lunex-art-wrap .lunex-theme-pattern i{font-size:24px}}

/* LUNEX: enlarged standalone Game Center inventory */
.lunex-game-inventory{margin-top:0;padding:20px;border-radius:22px;min-height:420px}
.lunex-game-inventory-head{margin-bottom:18px}
.lunex-game-inventory-head h3{font-size:20px}
.lunex-game-inv-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lunex-game-inv-card{min-height:250px;padding:16px;border-radius:20px}
.lunex-game-inv-card .lunex-game-inv-art{width:150px;height:150px;max-width:100%;margin:0 auto 10px;object-fit:contain}
.lunex-profile-variant{display:block;font-weight:700;color:#d5a83f;margin-top:3px}
@media(max-width:520px){.lunex-game-inv-grid{grid-template-columns:1fr}.lunex-game-inv-card .lunex-game-inv-art{width:170px;height:170px}}

  };
  const FALLBACK=['✦','✧'];
  const pos=[[8,10,-12],[72,7,8],[42,19,16],[17,37,5],[82,32,-14],[54,45,11],[4,64,14],[68,62,-8],[31,75,-16],[88,79,10],[51,90,-10],[14,89,7]];
  function symbolsFor(art){return MAP[String(art||'').toLowerCase()]||FALLBACK;}
  function decorate(el){
    if(!el || el.querySelector(':scope > .lunex-theme-pattern')) return;
    const art=el.dataset.giftArt||''; const [a,b]=symbolsFor(art);
    const wrap=document.createElement('span');wrap.className='lunex-theme-pattern';wrap.setAttribute('aria-hidden','true');
    pos.forEach((p,i)=>{const n=document.createElement('i');n.textContent=(i%2?a:b);n.style.left=p[0]+'%';n.style.top=p[1]+'%';n.style.transform='translate(-50%,-50%) rotate('+p[2]+'deg)';n.style.fontSize=(i%3===0?'1.05em':i%3===1?'.82em':'.94em');wrap.appendChild(n);});
    el.prepend(wrap);
  }
  function scan(root=document){root.querySelectorAll?.('.lunex-themed-backdrop[data-gift-art]').forEach(decorate);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>scan()); else scan();
  const obs=new MutationObserver(muts=>{for(const m of muts) for(const n of m.addedNodes) if(n.nodeType===1) {if(n.matches?.('.lunex-themed-backdrop[data-gift-art]')) decorate(n);scan(n);}});

<script id="lunex-all-gift-pictures-restore">
/* RESTORE ALL GIFT ART: every gift keeps its real Telegram/CDN picture when available;
   if a CDN image fails, immediately show a local Lunex illustrated fallback instead of a blank tile. */
(function(){
  function fallbackForImage(img){
    if(!img || img.dataset.lunexFallbackDone==='1') return;
    const src=img.getAttribute('src')||'';
    if(!/cdn\.changes\.tg/i.test(src)) return;
    const raw=(img.alt||'gift').trim().toLowerCase();
    const item=(typeof giftItems!=='undefined'&&Array.isArray(giftItems)) ? giftItems.find(g=>String(g.name||'').toLowerCase()===raw) : null;
    const kind=item?.art || img.dataset.giftArt || '';
    if(!kind) return;
    img.dataset.lunexFallbackDone='1';
    try{ img.src=lunexGiftArt(kind); }catch(e){}
  }
  document.addEventListener('error',function(e){
    if(e.target && e.target.tagName==='IMG') fallbackForImage(e.target);
  },true);
  function markImages(){
    document.querySelectorAll('img').forEach(img=>{
      if(img.dataset.giftArt) return;
      const src=img.getAttribute('src')||'';
      if(!/cdn\.changes\.tg/i.test(src)) return;
      const alt=(img.getAttribute('alt')||'').trim().toLowerCase();
      const item=(typeof giftItems!=='undefined'&&Array.isArray(giftItems)) ? giftItems.find(g=>String(g.name||'').toLowerCase()===alt) : null;
      if(item) img.dataset.giftArt=item.art;
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',markImages);
  else markImages();
  new MutationObserver(markImages).observe(document.documentElement,{subtree:true,childList:true});
})();
</script>

<script>

</script>
